                  const currentLeft = parseFloat(label.style.left);
                  const side = Number(label.dataset.labelSide || 1);
                  label.style.left = `${clamp(currentLeft + (side * 4), 8, 92)}%`;
                }
                moved = true;
              }
            }
            if (!moved) {
              break;
            }
          }
        });
      }

      function renderLane(dataset, minTime, maxTime) {
        const lane = document.createElement('div');
        lane.className = 'lane';

        const label = document.createElement('div');
        label.className = 'lane-label';
        label.innerHTML = `
          <div class="lane-name">${escapeHtml(dataset.datasetName)}</div>
          <div class="lane-meta">${escapeHtml(dataset.cellCompositeName || '')}</div>
          <div class="lane-meta">${escapeHtml(dataset.unitOperationInstance || '')}</div>
        `;

        const track = document.createElement('div');
        track.className = 'track';

        const graph = graphForDataset(dataset);
        distributeNodePositions(graph.nodes, minTime, maxTime);

        const nodesById = new Map(graph.nodes.map(node => [node.id, node]));
        const arrowId = `provArrow-${dataset.datasetId.replace(/[^a-zA-Z0-9_-]/g, '-')}`;
        const edgeLayer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        edgeLayer.classList.add('prov-edge-layer');
        edgeLayer.setAttribute('viewBox', `0 0 ${SVG_WIDTH} ${TRACK_HEIGHT}`);
        edgeLayer.setAttribute('preserveAspectRatio', 'none');
        edgeLayer.innerHTML = `
          <defs>
            <marker id="${arrowId}" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
              <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#6c757d"></path>
            </marker>
          </defs>
        `;
        track.appendChild(edgeLayer);

        const edgeFanCounts = new Map();
        graph.edges.forEach(edge => {
          const key = `${edge.from}:${edge.type}`;
          edgeFanCounts.set(key, (edgeFanCounts.get(key) || 0) + 1);
        });
        const edgeFanSeen = new Map();

        graph.edges.forEach(edge => {
          const from = nodesById.get(edge.from);
          const to = nodesById.get(edge.to);
          if (!from || !to) {
            return;
          }

          const fromX = from.x * 10;
          const toX = to.x * 10;
          const fanKey = `${edge.from}:${edge.type}`;
          const fanIndex = edgeFanSeen.get(fanKey) || 0;
          const fanCount = edgeFanCounts.get(fanKey) || 1;
          edgeFanSeen.set(fanKey, fanIndex + 1);
          const fanOffset = (fanIndex - ((fanCount - 1) / 2)) * EDGE_FAN_OFFSET;
          const fromAnchorOffset = EDGE_BASE_OFFSET + fanOffset;
          const toAnchorOffset = -EDGE_BASE_OFFSET + fanOffset;
          const fromAnchorX = clamp(
            fromX + fromAnchorOffset,
            fromX - NODE_HALF_WIDTH + 8,
            fromX + NODE_HALF_WIDTH - 8
          );
          const toAnchorX = clamp(
            toX + toAnchorOffset,
            toX - NODE_HALF_WIDTH + 8,
            toX + NODE_HALF_WIDTH - 8
          );
          const fromY = from.type === 'Entity' && to.type === 'Activity'
            ? from.y + NODE_HALF_HEIGHT
            : from.y - NODE_HALF_HEIGHT;
          const toY = to.type === 'Activity'
            ? to.y - NODE_HALF_HEIGHT
            : to.y + NODE_HALF_HEIGHT;

          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          const edgeType = edgeTypeKey(edge.type);
          path.classList.add('prov-edge');
          path.classList.add(edge.type === 'used' ? 'prov-edge-used' : 'prov-edge-generated');
          path.dataset.edgeType = edgeType;
          path.setAttribute('d', `M ${fromAnchorX} ${fromY} L ${toAnchorX} ${toY}`);
          path.setAttribute('marker-end', `url(#${arrowId})`);
          edgeLayer.appendChild(path);

          const edgeSide = toAnchorX >= fromAnchorX ? 1 : -1;
          const labelX = ((fromAnchorX + toAnchorX) / 2) / 10;

          const edgeLabel = document.createElement('button');
          edgeLabel.className = 'prov-edge-label';
          edgeLabel.type = 'button';
          edgeLabel.textContent = edgeTypeLabel(edge.type);
          edgeLabel.dataset.edgeType = edgeType;
          edgeLabel.dataset.labelSide = String(edgeSide);
          edgeLabel.style.left = `${clamp(labelX, 8, 92)}%`;
          edgeLabel.style.top = `${EDGE_LABEL_TOP[edgeType]}px`;
          edgeLabel.addEventListener('click', () => showEdgeDetails(edge, nodesById));
          track.appendChild(edgeLabel);
        });

        graph.nodes.forEach(node => {
          const nodeEl = document.createElement('button');
          const typeClass = node.type === 'Activity' ? 'prov-node-activity' : 'prov-node-entity';
          const dataClass = Number(node.dataFileCount || 0) > 0 ? ' prov-node-data' : '';
          nodeEl.className = `prov-node ${typeClass}${dataClass}`;
          nodeEl.type = 'button';
          nodeEl.style.left = `${node.x}%`;
          nodeEl.style.top = `${node.y}px`;
          nodeEl.innerHTML = `
            <span class="prov-node-type">${escapeHtml(node.type)}</span>
            <span class="prov-node-label">${escapeHtml(node.label)}</span>
          `;
          nodeEl.title = `${node.type}: ${node.label}`;
          nodeEl.setAttribute('aria-label', nodeEl.title);
          nodeEl.addEventListener('click', () => {
            selectNode(nodeEl);
            showNodeDetails(dataset, node);
          });
          track.appendChild(nodeEl);
        });

        lane.appendChild(label);
        lane.appendChild(track);
        return lane;
      }

      function render(data) {
        setupEdgeControls();
        let datasets = data.datasets || [];
        if (selectedDatasetId) {
          datasets = datasets.filter(dataset => dataset.datasetId === selectedDatasetId);
        }

        const timeline = document.getElementById('timeline');
        if (!datasets.length) {
          timeline.innerHTML = '<div class="empty-state">No cell expansion events were found for this dataset.</div>';
          return;
        }

        const graphs = new Map(datasets.map(dataset => [dataset.datasetId, graphForDataset(dataset)]));
        const allDates = datasets.flatMap(dataset =>
          graphs.get(dataset.datasetId).nodes.map(node => parseDate(node.date).getTime())
        );
        const oneHour = 60 * 60 * 1000;
        const minTime = Math.min(...allDates) - (6 * oneHour);
        const maxTime = Math.max(...allDates) + (6 * oneHour);

        document.getElementById('chartTitle').textContent = data.collectionName || 'Cell Expansion PROV Map';
        document.getElementById('chartSubtitle').textContent = `${datasets.length} dataset${datasets.length === 1 ? '' : 's'} - used / wasGeneratedBy`;

        timeline.appendChild(renderLegend());

        const axisRow = document.createElement('div');
        axisRow.className = 'axis-row';
        axisRow.innerHTML = '<div></div>';
        axisRow.appendChild(renderAxis(minTime, maxTime));
        timeline.appendChild(axisRow);

        datasets.forEach(dataset => {
          timeline.appendChild(renderLane(dataset, minTime, maxTime));
        });
        updateEdgeVisibility();

        setDetailsTitle('Event Details');
      }

      loadChartData()
        .then(render)
        .catch(error => {
          document.getElementById('timeline').innerHTML = `<div class="empty-state">${escapeHtml(error.message)}</div>`;
        });
    </script>
  </body>
</html>
