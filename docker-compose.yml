services:
  ldap:
    build: ./ldap
    container_name: ldap
    environment:
      - LDAP_ROOT=dc=labcas,dc=jpl,dc=nasa,dc=gov
      - LDAP_ADMIN_USERNAME=admin
      - LDAP_ADMIN_PASSWORD=secret
      - LDAP_LOGLEVEL=stats,stats2,config,acl
      - LDAP_DEBUG=true
      - BITNAMI_DEBUG=true
      # Enable LDAPS with the self-signed certificate generated during image build
      - LDAP_ENABLE_TLS=yes
      - LDAP_TLS_CERT_FILE=/etc/ldap/ssl/ldap-cert.pem
      - LDAP_TLS_KEY_FILE=/etc/ldap/ssl/ldap-key.pem
      - LDAP_TLS_CA_FILE=/etc/ldap/ssl/ldap-cert.pem
      - LDAP_LDAPS_PORT_NUMBER=1636
      - LDAP_TLS_VERIFY_CLIENT=never
      # Force TLS protocol to TLSv1.2 so that Java 8 clients (e.g., LabCAS backend) can establish LDAPS connections
      - LDAP_TLS_PROTOCOL_MIN=3.3
      - LDAP_CUSTOM_LDIF_DIR=/container-init.d
    ports:
      - "1636:1636"
    volumes:
      - ./ldap/custom_ldifs:/container-init.d
      - ./data/logs/ldap:/opt/bitnami/openldap/logs
    networks:
      - labcas-net

  labcas-backend:
    build: ./labcas-backend
    container_name: labcas-backend
    depends_on:
      - ldap
    environment:
      - LABCAS_HOME=/tmp/labcas
    ports:
      - "8444:8444"  # Map the backend service port
      - "8984:8984"  # Added for Solr access by publish and airflow
    expose:
      - "8081"
      - "8444"
      - "8984"
    volumes:
      - ./labcas-backend/labcas.properties:/root/labcas.properties
      - ./labcas-backend/server.xml:/tmp/labcas/apache-tomcat/conf/server.xml
      - labcas-solr-index:/tmp/labcas/solr-index
      - ./shared-config/labcas-backend:/config
      - ./data/logs/labcas-backend:/var/log/labcas-backend
      - ./data/logs/labcas-backend/tomcat:/tmp/labcas/apache-tomcat/logs
      - ./data/logs/labcas-backend/solr:/tmp/labcas/solr/server/logs
    networks:
      - labcas-net

  labcas-ui:
    build:
      context: ./labcas-ui
      args:
        LABCAS_UI_REPO: https://github.com/yuliujpl/labcas-nist-private.git
        LABCAS_UI_BRANCH: microbial_strain
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    container_name: labcas-ui
    depends_on:
      - labcas-backend
    ports:
      - "8081:8081"
    volumes:
      - ./labcas-ui/environment.cfg:/var/www/html/labcas-ui/assets/conf/environment.cfg
      - ./data/logs/labcas-ui:/var/log/apache2
      - ./shared-config/labcas-ui:/config/labcas-ui
    networks:
      - labcas-net
  mock-auth:
    build: ./mock-auth
    container_name: mock-auth
    depends_on:
      - labcas-backend
      - labcas-ui
    ports:
      - "3001:3001"
    expose:
      - "3001"
    networks:
      - labcas-net
    # environment:
    #   - REDIRECT_DEFAULT=http://localhost:80

  labcas-proxy:
      build: ./labcas-proxy
      volumes:
        - ./data/logs/nginx/:/var/log/nginx/
      expose:
          - "80"
          - "443"
          - "8099"
      ports:
          - "443:443"
          - "80:80"
          - "8099:8099"
      depends_on:
        - labcas-ui
        - labcas-backend
      links:
        - labcas-ui:labcas-ui
        - labcas-backend:labcas-backend
      image: labcas-proxy
      container_name: labcas-proxy
      restart: "on-failure:5"
      security_opt: [ no-new-privileges ]
      pids_limit: 50
      cap_drop:
            - NET_ADMIN
            - SYS_ADMIN
            - SYS_MODULE
      networks:
       - labcas-net

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - labcas-net

  airflow:
    build:
      context: ./airflow
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        PUBLISH_REPO_URL: ${PUBLISH_REPO_URL:-https://github.com/jpl-labcas/publish.git}
        PUBLISH_REPO_REF: ${PUBLISH_REPO_REF:-simplified_publish}
    container_name: airflow
    depends_on:
      - labcas-backend
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - DIND_ENABLED=1
      - BUILD_PUBLISH_IMAGE=1
      - START_PUBLISH_CONTAINER=1
      - PUBLISH_IMAGE=labcas-docker-clean-publish
      - PUBLISH_CONTAINER_NAME=labcas-publish
      - BUILD_LINKML_VALIDATOR_IMAGE=1
      - START_LINKML_VALIDATOR_CONTAINER=1
      - LINKML_VALIDATOR_IMAGE=labcas-docker-clean-linkml-validator
      - LINKML_VALIDATOR_CONTAINER_NAME=labcas-linkml-validator
      - LINKML_REPO_URL=${LINKML_REPO_URL:-https://github.com/usnistgov/nist-labcas-linkml.git}
      - LINKML_REPO_REF=${LINKML_REPO_REF:-main}
      - LINKML_GITHUB_TOKEN=${LINKML_GITHUB_TOKEN:-${GITHUB_TOKEN}}
      - AIRFLOW_DIND_DATA_PATH=/data
      - AIRFLOW_DIND_METADATA_PATH=/metadata
      - AIRFLOW_DIND_PUBLISH_CONFIG=/config/publish
      - AIRFLOW_DIND_LABCAS_DATA_PATH=/labcas-data
      - AIRFLOW_DIND_ARCHIVE_PATH=/data/archive
      - AIRFLOW_DIND_NETWORK_MODE=host
      # Absolute host paths for DockerOperator bind mounts (fallback to project dir via ${PWD})
      - HOST_PROJECT_ROOT=${HOST_PROJECT_ROOT:-${PWD}}
      - HOST_DATA_PATH=${HOST_DATA_PATH:-${PWD}/data}
      # Pass through optional metadata, publish config, archive, and labcas-data host paths
      - HOST_METADATA_PATH=${HOST_METADATA_PATH:-${PWD}/metadata}
      - HOST_PUBLISH_CONFIG=${HOST_PUBLISH_CONFIG:-${PWD}/shared-config/publish}
      - HOST_ARCHIVE_PATH=${HOST_ARCHIVE_PATH:-${PWD}/data/archive}
      - HOST_LABCAS_DATA=${HOST_LABCAS_DATA:-${PWD}/data/labcas-data}
      # Network name for DockerOperator (defaults to compose network)
      - COMPOSE_NETWORK_NAME=${COMPOSE_NETWORK_NAME:-labcas-docker-clean_labcas-net}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/scripts:/opt/airflow/scripts
      - ./airflow/logs:/opt/airflow/logs
      - ./data:/data
      - ./metadata:/metadata
      - ./shared-config/airflow:/config/airflow
      - ./shared-config/publish:/config/publish
      - ./publish:/opt/airflow/publish
      - ./data/labcas-data:/labcas-data
      - airflow-dind:/var/lib/docker
      # Allow the DAG’s BashOperator to reference the project compose file.
      - ./docker-compose.yml:/opt/airflow/docker-compose.yml:ro
      # Mount project read-only elsewhere so build contexts resolve
      - ./:/project:ro
    ports:
      - "8082:8080"
    networks:
      - labcas-net
    entrypoint: ["bash", "/opt/airflow/scripts/start_local_executor.sh"]
    command: []
    privileged: true
    user: root

  publish:
    build:
      context: ./publish
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        PUBLISH_REPO_URL: ${PUBLISH_REPO_URL:-https://github.com/jpl-labcas/publish.git}
        PUBLISH_REPO_REF: ${PUBLISH_REPO_REF:-simplified_publish}
    container_name: labcas-publish
    depends_on:
      - labcas-backend
    environment:
      - solr=https://labcas-backend:8984/solr/
      - SOLR_URL=https://labcas-backend:8984/solr/
      - consortium=${PUBLISH_CONSORTIUM:-NIST}
      - collection=${PUBLISH_COLLECTION}
      - publish=True
      - steps=${PUBLISH_STEPS}

    # Health-check so Airflow can wait until labcas-publish is ready
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f publishing_pipeline.py >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - ${HOST_METADATA_PATH:-./metadata}:/mnt/metadata:ro
      - ${HOST_DATA_PATH:-./data}:/data
      - ${HOST_LABCAS_DATA:-./data/labcas-data}:/labcas-data
      - ${HOST_ARCHIVE_PATH:-./data/archive}:/data/archive
      - ${HOST_PUBLISH_CONFIG:-./shared-config/publish}:/config/publish:ro
    networks:
      - labcas-net

  ldap-logs:
    image: cr.fluentbit.io/fluent/fluent-bit:2.2
    container_name: ldap-logs
    depends_on:
      - ldap
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./data/logs/ldap:/logs
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    command: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
    restart: unless-stopped
    networks:
      - labcas-net

networks:
  labcas-net:
volumes:
  labcas-solr-index:
  postgres-data:
  airflow-dind:
